on:
  workflow_call:
    inputs:
      package_name:
        description: "The name of the package (e.g., zod, multipart-form)"
        required: true
        type: string
      package_npm_workspace:
        description: "The npm workspace name for the package (e.g., @proventuslabs/nestjs-zod)"
        required: true
        type: string
      package_tag_name:
        description: "The release tag name for the package"
        required: true
        type: string
      prerelease_moves_latest:
        description: "Also point the `latest` dist-tag at prerelease publishes. Only for packages with no stable release yet; requires the NPM_TOKEN secret, since OIDC cannot authenticate `npm dist-tag`."
        required: false
        default: false
        type: boolean
    secrets:
      NPM_TOKEN:
        description: "npm granular access token with write access to the package. Only needed when prerelease_moves_latest is true."
        required: false

jobs:
  build-and-upload:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Cache root & workspace node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/${{ inputs.package_name }}/node_modules
          key: ${{ runner.os }}-node-24-npm-${{ hashFiles('package-lock.json', format('packages/{0}/package-lock.json', inputs.package_name)) }}
          restore-keys: |
            ${{ runner.os }}-node-24-npm-

      - run: npm ci

      - name: Build package ${{ inputs.package_name }}
        run: npm run build --workspace=${{ inputs.package_npm_workspace }}

      - name: Zip build artifact for ${{ inputs.package_name }}
        run: zip -r ${{ inputs.package_name }}-build.zip packages/${{ inputs.package_name }}/dist

      - name: Upload build artifact for ${{ inputs.package_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ inputs.package_tag_name }} ${{ inputs.package_name }}-build.zip

  publish-npm:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    needs: build-and-upload
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Cache root & workspace node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/${{ inputs.package_name }}/node_modules
          key: ${{ runner.os }}-node-24-npm-${{ hashFiles('package-lock.json', format('packages/{0}/package-lock.json', inputs.package_name)) }}
          restore-keys: |
            ${{ runner.os }}-node-24-npm-

      - run: npm ci

      - name: Resolve npm dist-tag from the version
        id: dist_tag
        run: |
          version="$(node -p "require('./packages/${{ inputs.package_name }}/package.json').version")"
          case "$version" in
            *-*) tag="${version#*-}"; tag="${tag%%.*}" ;;
            *)   tag="latest" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version under dist-tag $tag"

      - name: Publish ${{ inputs.package_npm_workspace }} to npm
        run: |
          npm publish \
            --workspace=${{ inputs.package_npm_workspace }} \
            --provenance \
            --access public \
            --tag ${{ steps.dist_tag.outputs.tag }}

      # `npm publish` sets exactly one dist-tag, and OIDC cannot authenticate
      # `npm dist-tag`, so moving `latest` onto a prerelease needs a token and a
      # separate step. NODE_AUTH_TOKEN is set only here, so the publish above
      # still resolves an empty token and falls through to trusted publishing.
      - name: Point latest at this prerelease
        if: ${{ inputs.prerelease_moves_latest && steps.dist_tag.outputs.tag != 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::prerelease_moves_latest is enabled for ${{ inputs.package_name }} but no NPM_TOKEN secret was passed to this workflow"
            exit 1
          fi
          echo "Moving latest to ${{ steps.dist_tag.outputs.version }} (also tagged ${{ steps.dist_tag.outputs.tag }})"
          npm dist-tag add \
            ${{ inputs.package_npm_workspace }}@${{ steps.dist_tag.outputs.version }} \
            latest
          npm dist-tag ls ${{ inputs.package_npm_workspace }}
